<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FizzBuzz Generator - Professional</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f6f9fc, #e9eff5);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .controls label {
      display: flex;
      flex-direction: column;
      font-size: 14px;
      color: #555;
    }

    .controls input {
      padding: 8px;
      width: 80px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-top: 4px;
      font-size: 14px;
    }

    .controls button {
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      background: linear-gradient(45deg, #6a11cb, #2575fc);
      color: white;
      font-weight: bold;
      transition: transform 0.2s, background 0.3s;
    }

    .controls button:hover {
      transform: scale(1.05);
      background: linear-gradient(45deg, #2575fc, #6a11cb);
    }

    main {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
    }

    main div {
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      color: white;
      transition: transform 0.2s, box-shadow 0.2s;
      font-size: 16px;
    }

    main div:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    }

    /* Distinct colors for each type */
    .fizz { background-color: #3498db; }
    .buzz { background-color: #2ecc71; }
    .fizzbuzz { background-color: #e67e22; }
    .number { background-color: #95a5a6; color: #000; }

    /* Responsive text size for smaller screens */
    @media (max-width: 600px) {
      main div { font-size: 14px; height: 50px; }
      .controls input { width: 60px; }
    }

    @media (min-width: 1200px) {
      main div { font-size: 18px; height: 70px; }
    }
  </style>
</head>
<body>

  <h1>FizzBuzz Generator</h1>

  <div class="controls">
    <label>
      Start Value
      <input type="number" id="startValue" value="1">
    </label>
    <label>
      End Value
      <input type="number" id="endValue" value="100">
    </label>
    <label>
      Fizz Value
      <input type="number" id="fizzValue" value="3">
    </label>
    <label>
      Buzz Value
      <input type="number" id="buzzValue" value="5">
    </label>
    <button id="generateBtn">Generate Divs</button>
    <button id="clearBtn">Clear Divs</button>
  </div>

  <main></main>

  <script>
    const main = document.querySelector('main');
    const startInput = document.getElementById('startValue');
    const endInput = document.getElementById('endValue');
    const fizzInput = document.getElementById('fizzValue');
    const buzzInput = document.getElementById('buzzValue');
    const generateBtn = document.getElementById('generateBtn');
    const clearBtn = document.getElementById('clearBtn');

    function generateFizzBuzz(start = 1, end = 100, fizz = 3, buzz = 5) {
      main.innerHTML = ''; // Clear previous divs

      for (let i = start; i <= end; i++) {
        const div = document.createElement('div');
        div.id = 'myid' + i;

        if (i % fizz === 0 && i % buzz === 0) {
          div.classList.add('fizzbuzz');
          div.innerText = 'FizzBuzz';
        } else if (i % fizz === 0) {
          div.classList.add('fizz');
          div.innerText = 'Fizz';
        } else if (i % buzz === 0) {
          div.classList.add('buzz');
          div.innerText = 'Buzz';
        } else {
          div.classList.add('number');
          div.innerText = i;
        }

        main.appendChild(div);
      }
    }

    generateBtn.addEventListener('click', () => {
      const start = parseInt(startInput.value) || 1;
      const end = parseInt(endInput.value) || 100;
      const fizz = parseInt(fizzInput.value) || 3;
      const buzz = parseInt(buzzInput.value) || 5;
      generateFizzBuzz(start, end, fizz, buzz);
    });

    clearBtn.addEventListener('click', () => {
      main.innerHTML = '';
    });

    // Initial generation
    generateFizzBuzz();
  </script>
</body>
</html>
